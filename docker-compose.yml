services:
  mongo:
    image: mongo:7
    container_name: rmc-mongo
    ports:
      - "27017:27017"
    volumes:
      - rmc-mongo-data:/data/db
    restart: unless-stopped

  server:
    build: ./server
    container_name: rmc-server
    depends_on:
      - mongo
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/rmc_billing
      - JWT_ACCESS_SECRET=dev_access_secret_change_me
      - JWT_REFRESH_SECRET=dev_refresh_secret_change_me
      - CLIENT_ORIGIN=http://localhost:5173
      - COOKIE_DOMAIN=localhost
      - SMS_PROVIDER=stub
      - MAIL_FROM=RMC Billing <no-reply@rmc.local>
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: rmc-client
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  rmc-mongo-data:
